<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Future Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050816;--ink:#e9efff;--mute:#a3b3d8;--cy:#3df2ff;--vi:#9b6bff;--go:#ffc857;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:radial-gradient(1200px 800px at 80% -10%,#1b1450 0,transparent 60%),radial-gradient(900px 700px at 0% 40%,#08224a 0,transparent 60%),var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.65;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,nav,#bar{position:relative;z-index:1}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--cy),var(--vi),var(--go));z-index:60;box-shadow:0 0 12px var(--cy)}
nav{position:fixed;top:3px;left:0;right:0;z-index:50;display:flex;gap:6px;overflow-x:auto;padding:10px 4vw;background:rgba(5,8,22,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(155,107,255,.25);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--mute);text-decoration:none;font-size:.78rem;padding:6px 13px;border-radius:999px;border:1px solid transparent;transition:.3s}
nav a:hover,nav a.on{color:#fff;border-color:var(--cy);background:rgba(61,242,255,.1);box-shadow:0 0 14px rgba(61,242,255,.35)}
nav a:focus-visible,.hero a:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.hero{min-height:100svh;display:grid;place-content:center;text-align:center;padding:110px 6vw 60px}
.hero h1{font-size:clamp(2.6rem,9vw,7rem);font-weight:800;line-height:1.02;letter-spacing:-.03em;background:linear-gradient(100deg,#fff 10%,var(--cy) 45%,var(--vi) 75%,var(--go));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 2.2s cubic-bezier(.2,.7,.2,1) both,glow 4s 2s ease-in-out infinite alternate}
.hero p{margin:22px auto 0;max-width:34ch;color:var(--mute);font-weight:300;font-size:clamp(1rem,2.4vw,1.35rem);animation:rise 2.2s .6s cubic-bezier(.2,.7,.2,1) both}
.hero .go{margin:46px auto 0;display:inline-block;color:var(--cy);text-decoration:none;border:1px solid var(--cy);padding:12px 28px;border-radius:999px;animation:rise 2.2s 1.1s both;transition:.3s}
.hero .go:hover{background:rgba(61,242,255,.14);box-shadow:0 0 28px rgba(61,242,255,.45)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes glow{from{filter:drop-shadow(0 0 10px rgba(61,242,255,.25))}to{filter:drop-shadow(0 0 34px rgba(155,107,255,.6))}}
section.tech{min-height:100svh;display:grid;align-content:center;padding:96px 5vw 56px;--a:var(--cy)}
.stage{width:min(1180px,100%);margin:0 auto;opacity:0;transform:scale(.93) translateY(30px);transition:opacity 1.1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.stage.in{opacity:1;transform:none}
.shot{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;border:1px solid color-mix(in srgb,var(--a) 60%,transparent);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 30px 90px -34px var(--a);transform:perspective(1200px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .4s;background:#0a1030}
.shot:hover{box-shadow:0 0 0 1px var(--a),0 0 60px -6px var(--a),0 40px 100px -30px var(--a)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transform:translateY(var(--py,0px)) scale(1.1);will-change:transform}
.card{position:relative;width:min(780px,94%);margin:-48px 0 0 3%;padding:clamp(20px,3.4vw,34px);border-radius:20px;background:linear-gradient(145deg,rgba(18,26,66,.72),rgba(10,14,40,.62));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid color-mix(in srgb,var(--a) 45%,rgba(255,255,255,.1));box-shadow:0 20px 60px -20px rgba(0,0,0,.7)}
.card h2{font-size:clamp(1.6rem,4.2vw,2.8rem);line-height:1.1;letter-spacing:-.02em;font-weight:800;color:var(--a);text-shadow:0 0 24px color-mix(in srgb,var(--a) 55%,transparent)}
.card p{margin-top:14px;color:#d3ddf7;font-weight:300;font-size:clamp(.95rem,1.8vw,1.1rem);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chips span{font-size:.82rem;padding:7px 15px;border-radius:999px;border:1px solid color-mix(in srgb,var(--a) 70%,transparent);background:color-mix(in srgb,var(--a) 12%,transparent);color:#fff}
.end{min-height:90svh;display:grid;place-content:center;text-align:center;padding:80px 7vw}
.end h2{font-size:clamp(1.7rem,5.4vw,4rem);line-height:1.18;font-weight:800;max-width:20ch;margin:0 auto;letter-spacing:-.02em;background:linear-gradient(100deg,var(--cy),var(--vi) 55%,var(--go));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(155,107,255,.4))}
.end small{display:block;margin-top:30px;color:var(--mute)}
@media(max-width:640px){.card{margin:-26px auto 0;width:96%}.shot{border-radius:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.stage{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="bar" aria-hidden="true"></div>
<nav id="nav" aria-label="Technologies"></nav>

<main>
<header class="hero" id="top">
  <h1>The Future<br>Universe</h1>
  <p>Ten technologies for a world that runs itself.</p>
  <a class="go" href="#t1">Begin the journey</a>
</header>
<div id="list"></div>
<footer class="end" id="end">
  <h2>A world where hands are only for eating, and everything else happens by itself.</h2>
  <small>The Future Universe</small>
</footer>
</main>

<script>
(function(){
  var T=[
    {n:"Thought-Powered World",s:"Thought",img:"images/5.webp",a:"#3df2ff",p:"Doors open, cars start and furniture moves the moment you intend it. Your mind becomes the only controller you need, and your hands stay free and relaxed.",c:["Control by Thought","No Screens","No Buttons"]},
    {n:"Intelligence in the Air",s:"Air",img:"images/9.webp",a:"#ffc857",p:"A quiet intelligence fills every room and understands what you want before you ask. Food, light and comfort simply arrive, with no device to pick up.",c:["Ambient Intelligence","Knows Your Intent","Zero Interface"]},
    {n:"Blink-Speed Travel",s:"Travel",img:"images/10.webp",a:"#9b6bff",p:"Step through a glowing gateway and arrive on the other side of the world. Distance stops mattering, and so does every vehicle ever built to cross it.",c:["Instant Travel","Distance Means Nothing","No Vehicle Needed"]},
    {n:"Money-Free Abundance",s:"Abundance",img:"images/7.webp",a:"#ffc857",p:"When everything is abundant, nothing needs a price. Think of what you need and it takes shape in your open hands, for every family, everywhere.",c:["No Money","Everything Abundant","Think and Receive"]},
    {n:"The Living School Companion",s:"Learning",img:"images/8.webp",a:"#3df2ff",p:"Every child has a glowing guide that follows their curiosity. Galaxies, animals and equations appear in the air, and learning happens anywhere, under any tree.",c:["Personal Learning Companion","Follows Your Curiosity","No Classrooms Needed"]},
    {n:"Self-Shaping Homes",s:"Homes",img:"images/11.webp",a:"#5dffb0",p:"Walls flow like liquid metal and become a bedroom, a kitchen or a garden as you walk through. The house grows, adapts and repairs itself.",c:["Shape-Shifting Rooms","Living Architecture","Grows and Repairs Itself"]},
    {n:"Nano-Healing Cloud",s:"Healing",img:"images/3.png",a:"#ff6b8b",p:"Microscopic machines travel through the body, find damage and repair it long before you feel any pain. Illness becomes a story from the past.",c:["Disease-Free Life","Nano Repair","Heals Before You Feel Pain"]},
    {n:"Endless Energy Core",s:"Energy",img:"images/2.png",a:"#ffc857",p:"A radiant core of clean energy feeds an entire city through beams of light. Nothing is wasted, and nothing ever runs out.",c:["Infinite Clean Energy","Zero Waste","Powers Everything"]},
    {n:"Self-Driving Cities",s:"Cities",img:"images/1.png",a:"#ffa45c",p:"Silent pods glide through the sky, drones deliver every parcel and robots tend the farms. The whole city moves in harmony, with no traffic and no effort.",c:["Fully Automatic City","Zero Traffic","Everything Delivered by Itself"]},
    {n:"Universe Connection Layer",s:"Cosmos",img:"images/4.png",a:"#9b6bff",p:"One person stands calm at the center of a living network of stars, holding a plate of food. The universe quietly handles everything else.",c:["Connected to the Cosmos","Beyond Alien Technology","Hands Only for Eating"]}
  ];
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var list=document.getElementById("list"),nav=document.getElementById("nav");

  T.forEach(function(t,i){
    var id="t"+(i+1);
    var a=document.createElement("a");a.href="#"+id;a.textContent=t.s;a.dataset.id=id;nav.appendChild(a);
    var sec=document.createElement("section");sec.className="tech";sec.id=id;sec.style.setProperty("--a",t.a);
    sec.innerHTML='<div class="stage"><div class="shot"><img src="'+t.img+'" alt="'+t.n+': '+t.c.join(", ")+'" loading="'+(i<2?"eager":"lazy")+'"></div>'+
      '<div class="card"><h2>'+t.n+'</h2><p data-t="'+t.p.replace(/"/g,"&quot;")+'">'+t.p+'</p><div class="chips">'+t.c.map(function(x){return"<span>"+x+"</span>"}).join("")+'</div></div></div>';
    list.appendChild(sec);
  });

  /* typewriter */
  function type(p){
    var txt=p.dataset.t,i=0;p.textContent="";
    (function step(){i+=2;p.textContent=txt.slice(0,i);if(i<txt.length)setTimeout(step,16)})();
  }
  var typed=new WeakSet();
  if(!reduce){document.querySelectorAll(".card p").forEach(function(p){p.style.minHeight=p.offsetHeight+"px"})}

  /* reveal + typewriter + nav highlight */
  var links=nav.querySelectorAll("a");
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){
      var st=e.target.querySelector(".stage");st.classList.add("in");
      var p=e.target.querySelector(".card p");
      if(!reduce&&!typed.has(p)){typed.add(p);setTimeout(function(){type(p)},500)}
    }
  })},{threshold:.35});
  document.querySelectorAll("section.tech").forEach(function(s){io.observe(s)});

  var io2=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){links.forEach(function(l){var on=l.dataset.id===e.target.id;l.classList.toggle("on",on);if(on)l.scrollIntoView({inline:"center",block:"nearest",behavior:reduce?"auto":"smooth"})})}
  })},{rootMargin:"-45% 0px -45% 0px"});
  document.querySelectorAll("section.tech").forEach(function(s){io2.observe(s)});

  /* tilt */
  document.querySelectorAll(".shot").forEach(function(el){
    el.addEventListener("pointermove",function(e){
      if(reduce||e.pointerType==="touch")return;
      var r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      el.style.setProperty("--ry",(x*7).toFixed(2)+"deg");el.style.setProperty("--rx",(-y*5).toFixed(2)+"deg");
    });
    el.addEventListener("pointerleave",function(){el.style.setProperty("--rx","0deg");el.style.setProperty("--ry","0deg")});
  });

  /* progress + parallax */
  var bar=document.getElementById("bar"),shots=[].slice.call(document.querySelectorAll(".shot")),ticking=false;
  function onScroll(){
    var h=document.documentElement.scrollHeight-innerHeight;
    bar.style.transform="scaleX("+(h>0?scrollY/h:0)+")";
    if(!reduce){shots.forEach(function(s){
      var r=s.getBoundingClientRect();
      if(r.bottom<0||r.top>innerHeight)return;
      var d=(r.top+r.height/2-innerHeight/2)/innerHeight;
      s.style.setProperty("--py",(d*-34).toFixed(1)+"px");
    })}
    ticking=false;
  }
  addEventListener("scroll",function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});
  addEventListener("resize",onScroll);onScroll();

  /* starfield */
  var cv=document.getElementById("stars"),cx=cv.getContext("2d"),S=[],W,H,dpr=Math.min(devicePixelRatio||1,2);
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(W*H/9000);S=[];
    for(var i=0;i<n;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,v:Math.random()*.15+.03,t:Math.random()*6.28,c:["#ffffff","#8fe9ff","#c3a8ff","#ffe29a"][i%4]});}
  function draw(){
    cx.clearRect(0,0,W,H);
    S.forEach(function(s){
      s.t+=.02;if(!reduce){s.y-=s.v;if(s.y<-2){s.y=H+2;s.x=Math.random()*W}}
      cx.globalAlpha=.35+.65*Math.abs(Math.sin(s.t));cx.fillStyle=s.c;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();
    });
    if(!reduce)requestAnimationFrame(draw);
  }
  size();draw();addEventListener("resize",function(){size();if(reduce)draw()});
})();
</script>
</body>
</html>
